<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <!-- <div class="container"> -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow ">
            <div class="container-fluid">
                <!-- Brand Logo / Text -->
                <a class="navbar-brand fw-bold" href="#">MyBrand</a>

                <!-- Mobile Hamburger Toggle Button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Collapsible Wrapper -->
                <div class="collapse navbar-collapse" id="mainNavbar">

                    <!-- 1. Left Aligned Links (me-auto pushes the next element to the right) -->
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Features</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Pricing</a>
                        </li>
                    </ul>

                    <!-- 2. Right Aligned Sign In / Sign Up Actions -->
                    <!-- On mobile, d-flex flex-column stacks buttons vertically; on desktop (lg), flex-row aligns them horizontally -->
                    <div class="d-flex flex-column flex-lg-row gap-2">
                        <a href="#" class="btn btn-outline-light btn-sm px-3">Sign In</a>
                        <a href="#" class="btn btn-primary btn-sm px-3">Sign Up</a>
                    </div>

                </div>
            </div>
        </nav>
    <!-- </div> -->




</body>

</html>
