<body>
    <!-- 
        height class : h-25 | h-50 | h-75 | h-100 | h-auto |
        ex: h-25: 25% of the parent container's total height. etc.
        h-auto: Sets the height automatically based on the content inside it (Auto).
        min-height class : min-vh-100 | min-vh-75 | min-vh-50 | min-vh-25 |
        max-height class : max-vh-100 | max-vh-75 | max-vh-50 | max-vh-25 |
    -->

    <div class="container">
        <div class="bg-info text-success ">background info with success text</div>
        <div class="bg-warning text-primary">background warning with primary text</div>
