    <div class="container mt-5 p-3 bg-light">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 ">
                <div class="card shadow-sm border-0 ">
                    <div class="card-header py-3 bg-success text-white text-center fw-semibold">
                        <h5 class="mb-0">Employee Form</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" id="name" class="form-control" placeholder="Enter Your Name"
                                    required>
                            </div>

                            <div class="row mb-3 g-3">
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" id="email" class="form-control" placeholder="Enter Your Email"
                                        required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" id="password" class="form-control"
                                        placeholder="Enter Your Password" required>
                                </div>
                            </div>

                            <div class="row mb-3 g-2">
                                <div class="col-12 col-md-4">
                                    <label for="state" class="form-label">State</label>
                                    <input id="state" class="form-control" value="kolkata" readonly required> 
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="district" class="form-label">District</label>
                                    <select id="district" class="form-select" required>
                                        <option value="" disabled selected>choose district</option>
                                        <option value="north">North</option>
                                        <option value="south">South</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label for="sub-district" class="form-label">Sub-District</label>
                                    <select id="sub-district" class="form-select" required>
                                        <option value="" disabled selected>choose sub-district</option>
                                        <option value="sub-district-1">Sub-District 1</option>
                                        <option value="sub-district-2">Sub-District 2</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="language" class="form-label">Language</label>

                                <div class="d-flex gap-5">
                                    <div class="form-check">
                                        <input type="radio" name="selectLanguage" id="hindi" class="form-check-input"
                                            value="hindi">
                                        <label for="hindi" class="form-check-label">Hindi</label>
                                    </div>

                                    <div class="form-check">
                                        <input type="radio" id="english" name="selectLanguage" value="english"
                                            class="form-check-input">
                                        <label for="english" class=" form-check-label">English</label>
                                    </div>

                                    <div class="form-check">
                                        <input type="radio" id="both" name="selectLanguage" value="Hindi_English"
                                            class="form-check-input">
                                        <label for="both" class=" form-check-label">Both</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-center">
                                <button type="submit" class="btn btn-outline-success w-75">Submit</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
