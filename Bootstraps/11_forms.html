<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form Layout</title>
    <!-- बिल्कुल सही और स्थिर Bootstrap 5.3.3 CDN लिंक -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-light">

    <!-- मुख्य कंटेनर और रो (सेंटर अलाइनमेंट के लिए) -->
    <div class="container mt-5">
        <!-- इमेज के अनुसार फॉर्म थोड़ा चौड़ा है, इसलिए हमने col-lg-8 लिया है ताकि डेस्कटॉप पर अच्छा दिखे -->
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                
                <!-- मुख्य कार्ड (border-0 और shadow-sm) -->
                <div class="card border-0 shadow-sm">
                    
                    <!-- कार्ड हेडर (इमेज के अनुसार ब्लू बैकग्राउंड और व्हाइट टेक्स्ट) -->
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="mb-0 fw-bold">Employee Form</h5>
                    </div>
                    
                    <!-- कार्ड बॉडी (असली फॉर्म) -->
                    <div class="card-body p-4">
                        <form action="">
                            
                            <!-- मुख्य ग्रिड रो (Row) जो सभी फ़ील्ड्स को संभालेगी -->
                            <div class="row g-3">
                                
                                <!-- 1. FirstName (पूरी चौड़ाई) -->
                                <div class="col-12">
                                    <label for="firstName" class="form-label fw-semibold text-dark">FirstName</label>
                                    <input type="text" id="firstName" class="form-control" required>
                                </div>

                                <!-- 2. LastName (पूरी चौड़ाई) -->
                                <div class="col-12">
                                    <label for="lastName" class="form-label fw-semibold text-dark">LastName</label>
                                    <input type="text" id="lastName" class="form-control" required>
                                </div>

                                <!-- 3. Email (आधा हिस्सा - col-md-6) -->
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label fw-semibold text-dark">Email</label>
                                    <input type="email" id="email" class="form-control" required>
                                </div>

                                <!-- 4. Password (आधा हिस्सा - col-md-6) -->
                                <div class="col-12 col-md-6">
                                    <label for="password" class="form-label fw-semibold text-dark">Password</label>
                                    <input type="password" id="password" class="form-control" required>
                                </div>

                                <!-- 5. Country (तिहाई हिस्सा - col-md-4) -->
                                <div class="col-12 col-md-4">
                                    <label for="country" class="form-label fw-semibold text-dark">Country</label>
                                    <input type="text" id="country" class="form-control" required>
                                </div>

                                <!-- 6. State (तिहाई हिस्सा - col-md-4) -->
                                <div class="col-12 col-md-4">
                                    <label for="state" class="form-label fw-semibold text-dark">State</label>
                                    <input type="text" id="state" class="form-control" required>
                                </div>

                                <!-- 7. City (तिहाई हिस्सा - col-md-4) -->
                                <div class="col-12 col-md-4">
                                    <label for="city" class="form-label fw-semibold text-dark">City</label>
                                    <input type="text" id="city" class="form-control" required>
                                </div>

                                <!-- 8. बटन सेक्शन (इमेज के अनुसार लेफ्ट अलाइन छोटे बटन) -->
                                <div class="col-12 mt-4">
                                    <!-- गप देने के लिए gap-2 लगाया है -->
                                    <div class="d-flex gap-2">
                                        <!-- सबमिट बटन (हरा रंग - btn-success) -->
                                        <button type="submit" class="btn btn-success px-4 fw-bold">Submit</button>
                                        <!-- रीसेट बटन (लाल रंग - btn-danger) -->
                                        <button type="reset" class="btn btn-danger px-4 fw-bold">Reset</button>
                                    </div>
                                </div>

                            </div> <!-- ग्रिड रो समाप्त -->
                        </form>
                    </div> <!-- कार्ड बॉडी समाप्त -->

                </div> <!-- कार्ड समाप्त -->

            </div>
        </div>
    </div>

</body>
</html>


</body>
