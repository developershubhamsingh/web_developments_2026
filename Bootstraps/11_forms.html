    <div class="container mt-5  ">
        <div class="row p-2 justify-content-center border border-1 border-light">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header text-center py-3 bg-success text-white">
                        <h5 class="mb-0 fw-bold">Employee Form </h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold text-dark">Full Name : </label>
                                <input type="text" id="name" class="form-control" placeholder="Enter Your Name ">
                            </div>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label fw-semibold text-dark">Email : </label>
                                    <input type="email" id="email" class="form-control" placeholder="Enter Your Email ">
                                </div>
                                <label for="password" class="form-label fw-semibold text-dark">Password : </label>
                                <input type="password" id="password" class="form-control"
                                    placeholder="Enter Your Password ">
                            </div>


                            <div class="d-flex justify-content-center">
                                <button type="submit" class="mt-2 btn btn-outline-success w-75 py-2">Submit</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
