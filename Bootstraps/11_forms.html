    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 ">
                <div class="card shadow-sm border-0">
                    <div class="card-header py-3 bg-success text-white text-center fw-semibold">
                        <h5 class="mb-0">Employee Form</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Name </label>
                                <input type="text" id="name" class="form-control" placeholder="Enter Your Name"
                                    required>
                            </div>

                            <div class="row mb-3 g-2">
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label fw-semibold">Email </label>
                                    <input type="email" id="email" class="form-control" placeholder="Enter Your Email"
                                        required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="password" class="form-label fw-semibold">Password </label>
                                    <input type="password" id="password" class="form-control"
                                        placeholder="Enter Your Password">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="language" class="form-label">language </label>
                                <div class="d-flex gap-5">
                                    <div class="form-check">
                                        <input type="radio" id="hindi" name="selectLanguage" class="form-check-input"
                                            value="Hindi">
                                        <label for="hindi" class="form-check-label">Hindi</label>

                                    </div>

                                    <div class="form-check">
                                        <input type="radio" id="english" name="selectLanguage" class="form-check-input"
                                            value="English">
                                        <label for="english" class="form-check-label">English</label>

                                    </div>

                                    <div class="form-check">
                                        <input type="radio" id="both" name="selectLanguage" class="form-check-input"
                                            value="Hindi&English">
                                        <label for="both" class="form-check-label">Both</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-center">
                                <button type="button" class=" btn btn-outline-success w-75">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
