<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <!-- 
        border : border border-1 | border-2 | border-3 | border-4 | border-5 |
        border : border border-top | border-bottom | border-start | border-end |
        border color :border border-primary | border-secondary | border-success | border-danger | border-warning |    

     -->
    <!-- 
         margin class : m-0 | m-1 | m-2 | m-3 | m-4 | m-5 |
         margin top class : mt-0 | mt-1 | mt-2 | mt-3 | mt-4 | mt-5 |
         margin bottom class : mb-0 | mb-1 | mb-2 | mb-3 | mb-4 | mb-5 |
         margin left class : ms-0 | ms-1 | ms-2 | ms-3 | ms-4 | ms-5 |
         margin right class : me-0 | me-1 | me-2 | me-3 | me-4 | me-5 |
     -->
    <!--
         padding class : p-0 | p-1 | p-2 | p-3 | p-4 | p-5 |
         padding top class : pt-0 | pt-1 | pt-2 | pt-3 | pt-4 | pt-5 |
         padding bottom class : pb-0 | pb-1 | pb-2 | pb-3 | pb-4 | pb-5 |
         padding left class : ps-0 | ps-1 | ps-2 | ps-3 | ps-4 | ps-5 |
         padding right class : pe-0 | pe-1 | pe-2 | pe-3 | pe-4 | pe-5 |
-->

    <!-- if u give margin or padding on first child it will not apply so give margin or padding to the parents  -->

    <div class="container bg-success pt-3">
        <p class="bg-primary pt-3">This is a paragraph with primary background with padding.</p>
    </div>

    <div class="container mt-5 bg-success border border-3 border-dark ">
        <p class="bg-primary m-3">This is a paragraph with primary background with margin.</p>

    </div>



















</body>

</html>
