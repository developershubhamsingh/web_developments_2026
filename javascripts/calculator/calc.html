<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./calc.js"></script>
    <style>
        .form-control:focus {
            box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.25);
        }
    </style>
</head>

<body>
    <!-- 
        form-control | form-control-lg |
        text-end | fw-bold | bg-light |
        placeholder="0" | readonly |
        rounded-4 | readonly |
    -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="py-3 card-header bg-dark text-light text-center">
                        <h3 class="mb-0 fw-bold">calculator</h3>
                    </div>
                    <div class="card-body p-5 bg-light">
                        <div class="mb-3">
                            <input type="text" id="display"
                                class="form-control form-control-lg text-end fw-bold bg-light" placeholder="0" readonly>
                        </div>
                        <div class="row mb-2 g-3">
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('1')">1</button>
                            </div>
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('2')">2</button>
                            </div>
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('3')">3</button>
                            </div>
                            <div class="col-3"><button class="btn btn-warning py-2 w-100"
                                    onclick="press('+')">+</button></div>
                        </div>
                        <div class="row mb-2 g-3">
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('4')">4</button>
                            </div>
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('5')">5</button>
                            </div>
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('6')">6</button>
                            </div>
                            <div class="col-3"><button class="btn btn-warning py-2 w-100"
                                    onclick="press('-')">-</button></div>
                        </div>
                        <div class="row mb-3 g-3">
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('7')">7</button>
                            </div>
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('8')">8</button>
                            </div>
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('9')">9</button>
                            </div>
                            <div class="col-3"><button class="btn btn-warning py-2 w-100"
                                    onclick="press('*')">x</button></div>
                        </div>
                        <div class="row mb-3 g-3">
                            <div class="col-3"><button class="btn btn-dark py-2 w-100" onclick="press('0')">0</button>
                            </div>
                            <div class="col-3"><button class="btn btn-warning py-2 w-100"
                                    onclick="press('/')">/</button></div>
                            <div class="col-3"><button class="btn btn-warning py-2 w-100"
                                    onclick="press('%')">%</button></div>
                            <div class="col-3"><button class="btn btn-warning py-2 w-100"
                                    onclick="clearScreen()">C</button></div>

                        </div>
                        <div class="row mb-3 g-3">
                            <div class="col-6"><button class="btn btn-warning py-2 w-100" onclick="Delete()">D</button>
                            </div>
                            <div class="col-6"><button class="btn btn-warning py-2 w-100"
                                    onclick="calculate()">=</button></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // 1. Pehle input screen ko pakad kar 'screen' variable me rakh liya
        const screen = document.getElementById("display");
        console.log(screen.placeholder)

        // 1. Pehle input screen ko pakad kar 'screen' variable me rakh liya
        const press = (number) => {
            screen.value = screen.value + number
        }

        // NEW: Screen saaf karne ka naya kaam
        const clearScreen = () => {
            // Iska matlab screen ko ekdam khali kar do
            screen.value = "";
        }
        //delete button controlling
        const Delete = () => {
            screen.value = screen.value.slice(0, -1);
        }

        // Math solve karne ka shortcut rule
        const calculate = () => {
            try {
                screen.value = eval(screen.value)
            } catch (err) {
                screen.value = "Error";
            }
        }
    </script>
</body>

</html>
