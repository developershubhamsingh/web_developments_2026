<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato</title>
    <link rel="icon" href="./images/icon.jfif">
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./midea_query.css">
</head>

<body>
    <header>

        <div class="brand">
            Zomato
        </div>
        <div class="social">
            <a href="https://www.facebook.com/"><img src="./images/fb.jfif" alt=""></a>
            <a href="https://www.instagram.com/"><img src="./images/insta.jfif" alt=""></a>
            <a href="https://www.youtube.com/"><img src="./images/youtube.png" alt=""></a>
        </div>
    </header>

    <div class="search">
        <div class="logo"><span>D!</span></div>
        <div class="heading">Find The Best Food Near You !</div>
        <div class="selectbox">
            <select name="" id="">
                <option value="" disabled selected>----- Select City -----</option>
                <option value="">Delhi</option>
                <option value="">Mumbai</option>
                <option value="">Karnataka</option>
                <option value="">Kolkata</option>
            </select>
            <select name="" id="" class="restSelect">
                <option value="" disabled selected>----- Select Restaurant -----</option>
                <option value=""> </option>
                <option value=""> </option>
                <option value=""> </option>
                <option value=""> </option>
            </select>
        </div>
    </div>
    <div class="quickSearch">
        <div class="quickheading">Quick Search </div>
        <span class="quickSubHeading">Find the best restaurants near you!</span>
        <div class="box">
            <div class="tile"></div>
        </div>
    </div>


</body>

</html>
